name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Backend ────────────────────────────────────────────────────────────
  api-quality:
    name: API — lint, types, import boundaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: black --check .
      # docs/03 §3.1: a bounded-context view may only reach another
      # context through its `services` module — enforced here, not just
      # documented, so a regression fails the PR instead of drifting.
      - run: lint-imports

  api-test:
    name: API — migrations & tests (postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ironman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      # A migration nobody generated is a schema drift nobody reviewed.
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: pytest --cov=. --cov-report=term-missing --cov-fail-under=70
      - run: python manage.py spectacular --file /tmp/openapi.yaml --fail-on-warn

  # ── Frontend ───────────────────────────────────────────────────────────
  web-quality:
    name: Web — lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/web -- --max-warnings=0
      - run: npx tsc --noEmit -p apps/web
      - run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1

  # ── End-to-end ─────────────────────────────────────────────────────────
  e2e:
    name: E2E — Playwright (API + web live)
    runs-on: ubuntu-latest
    needs: [api-test, web-quality]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ironman
          POSTGRES_PASSWORD: ironman
          POSTGRES_DB: ironman
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ironman"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://ironman:ironman@localhost:5432/ironman
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      DJANGO_SECRET_KEY: ci-test-secret
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install API deps and seed demo data
        working-directory: apps/api
        run: |
          pip install -r requirements/dev.txt
          python manage.py migrate
          python manage.py seed_demo
          nohup python manage.py runserver 0.0.0.0:8000 > /tmp/api.log 2>&1 &
          npx --yes wait-on http://localhost:8000/api/v1/healthz --timeout 30000

      - name: Install web deps, build and start
        run: |
          npm ci
          npm run build --workspace=apps/web
          nohup npm run start --workspace=apps/web -- -p 3000 > /tmp/web.log 2>&1 &
          npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: apps/web
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          retention-days: 14
