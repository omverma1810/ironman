[importlinter]
root_packages =
    common
    identity
    platform_core
    territory
    catalog
    customers
    ordering
    custody
    fulfilment
    supplies
    billing

# docs/03 §3.1: a view may call another bounded context's `services`
# module, but never reach into its `models` directly. Enforced per app so
# a future PR that adds "just one quick FK lookup" fails CI instead of
# quietly becoming next year's untangling job.

[importlinter:contract:territory-views-boundary]
name = territory.views reaches other contexts only through their services
type = forbidden
source_modules = territory.views
forbidden_modules =
    catalog.models
    customers.models
    ordering.models
    custody.models
    fulfilment.models
    supplies.models
    billing.models
allow_indirect_imports = True

