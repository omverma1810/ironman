        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: Staff account created
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: |-
        POST /auth/login — session-cookie auth for console users
        (docs/06 §2.2). Mandatory TOTP for ADMIN/FOUNDER.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
