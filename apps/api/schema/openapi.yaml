  /api/v1/billing/invoices/:
    get:
      operationId: billing_invoices_list
      description: |-
        docs/06 §3.2 object scoping, applied uniformly rather than
        per-viewset. A viewset sets `hub_field` (default "hub") to the
        queryset's path to its Hub FK; founders and superusers see everything,
        everyone else is filtered to their `user.hub_scope`.

        A viewset that additionally needs "own records only" (customer, field
        staff) should override `get_queryset()` and call
        `self.scope_to_hub(qs)` before applying the narrower own-record filter,
        so both scopes always apply together.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: string
          format: uuid
      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - DRAFT
          - ISSUED
          - PAID
        description: |-
          * `DRAFT` - Draft
          * `ISSUED` - Issued
          * `PAID` - Paid
          * `CANCELLED` - Cancelled
      tags:
      - billing
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceListList'
          description: ''
  /api/v1/billing/invoices/{order_id}/issue:
    post:
      operationId: billing_invoices_issue_create
      description: |-
        POST /billing/invoices/{order_id}/issue — same "action nested under
        a different app's resource id" shape as `custody.CreateBagForOrderView`.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - billing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueInvoiceRequest'
      security:
