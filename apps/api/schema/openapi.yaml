    post:
      operationId: auth_otp_request_create
      description: |-
        POST /auth/otp/request — docs/04 §3.1. Phone-first, no password;
        this is the entry point for the WhatsApp-link booking flow (R-101/R-102).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
