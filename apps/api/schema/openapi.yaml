openapi: 3.0.3
info:
  title: IronMan API
  version: 1.0.0
  description: Inventory, order, billing and growth platform for IronMan.
paths:
  /api/v1/auth/email/verify/confirm:
    post:
      operationId: auth_email_verify_confirm_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: Verified
  /api/v1/auth/email/verify/request:
    post:
      operationId: auth_email_verify_request_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Verification email sent
  /api/v1/auth/invite/accept:
    post:
      operationId: auth_invite_accept_create
      description: Console registration is invite-only (docs/06 §2.2).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffInviteAcceptRequest'
          application/x-www-form-urlencoded:
            schema:
