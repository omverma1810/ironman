  /api/v1/custody/bags/:
    get:
      operationId: custody_bags_list
      description: |-
        Bag lists are always narrow in practice — scoped to one order from
        the console, or eventually to one hub's WIP on the production board —
        never "every bag ever created". So list and retrieve both return the
        full nested shape (garment lines included): the console needs it on
        both, and there's no unscoped list heavy enough to make that costly.
      parameters:
      - in: query
        name: code
        schema:
          type: string
      - in: query
        name: current_stage
        schema:
          type: string
          enum:
          - DAMAGED
          - DELIVERED
          - DISPATCHED
          - HELD
          - LOST
          - PACKED
          - PRESSED
          - PRESSING
          - QC
          - RECEIVED
          - RETURNED_UNPRESSED
          - REWORK
          - SORTED
        description: |-
          * `RECEIVED` - Received
          * `SORTED` - Sorted
          * `PRESSING` - Pressing
          * `PRESSED` - Pressed
          * `QC` - Quality check
          * `REWORK` - Rework
          * `PACKED` - Packed
          * `DISPATCHED` - Dispatched
          * `DELIVERED` - Delivered
          * `DAMAGED` - Damaged
          * `LOST` - Lost
          * `HELD` - Held
          * `RETURNED_UNPRESSED` - Returned unpressed
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: hub
        schema:
          type: string
          format: uuid
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: order
        schema:
          type: string
          format: uuid
      tags:
      - custody
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBagDetailList'
          description: ''
