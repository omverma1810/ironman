          minimum: 1
        unit_cost:
          type: integer
          minimum: 0
        supplier:
          type: string
          default: ''
          maxLength: 120
        invoice_ref:
          type: string
          default: ''
          maxLength: 64
        note:
          type: string
          default: ''
          maxLength: 255
      required:
      - item
      - qty
      - unit_cost
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
