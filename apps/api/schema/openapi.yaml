        schema:
          type: string
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - APARTMENT_PROMO
          - FIRST_ORDER
          - FLAT
          - PERCENT
          - REFERRAL_CREDIT
        description: |-
          * `FIRST_ORDER` - First order discount
          * `REFERRAL_CREDIT` - Referral credit
          * `APARTMENT_PROMO` - Apartment promotion
          * `FLAT` - Flat discount
          * `PERCENT` - Percent discount
