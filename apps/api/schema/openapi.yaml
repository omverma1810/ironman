    OrderStatusEnum:
      enum:
      - DRAFT
      - PENDING_CONFIRMATION
      - SCHEDULED
      - PICKUP_ASSIGNED
      - PICKUP_EN_ROUTE
      - PICKUP_FAILED
      - PICKED_UP
      - AT_HUB
      - INTAKE_VERIFIED
      - IN_PRODUCTION
      - READY
      - DELIVERY_ASSIGNED
      - OUT_FOR_DELIVERY
      - DELIVERY_FAILED
      - RETURNED_TO_HUB
      - DELIVERED
      - ON_HOLD
      - CANCELLED
      - CLOSED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING_CONFIRMATION` - Pending confirmation
        * `SCHEDULED` - Scheduled
        * `PICKUP_ASSIGNED` - Pickup assigned
        * `PICKUP_EN_ROUTE` - Pickup en route
        * `PICKUP_FAILED` - Pickup failed
        * `PICKED_UP` - Picked up
        * `AT_HUB` - At hub
        * `INTAKE_VERIFIED` - Intake verified
        * `IN_PRODUCTION` - In production
        * `READY` - Ready
        * `DELIVERY_ASSIGNED` - Delivery assigned
        * `OUT_FOR_DELIVERY` - Out for delivery
        * `DELIVERY_FAILED` - Delivery failed
        * `RETURNED_TO_HUB` - Returned to hub
        * `DELIVERED` - Delivered
        * `ON_HOLD` - On hold
        * `CANCELLED` - Cancelled
        * `CLOSED` - Closed
    OtpRequestPurposeEnum:
      enum:
      - LOGIN
      - VERIFY
      type: string
      description: |-
        * `LOGIN` - LOGIN
        * `VERIFY` - VERIFY
